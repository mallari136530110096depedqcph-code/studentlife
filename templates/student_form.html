{% extends "base.html" %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">RECORD MANAGEMENT</p><h1>Add Student</h1><p class="muted">Enter academic information to create a student record.</p></div></div>
<div class="panel form-panel"><form method="post" class="form-grid"><div class="field wide"><label>Full Name</label><input name="student_name" required placeholder="Student full name"></div><div class="field"><label>Course</label><select name="course"><option>BSIT</option><option>BSCS</option><option>BSIS</option><option>Other</option></select></div><div class="field"><label>Year Level</label><select name="year_level"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="field"><label>Study Hours / Week (0–105)</label><input type="number" name="study_hours" min="0" max="105" step="0.1" required></div><div class="field"><label>Attendance (0–100%)</label><input type="number" name="attendance" min="0" max="100" step="0.1" required></div><div class="field"><label>Previous Grade (0–100)</label><input type="number" name="previous_grade" min="0" max="100" step="0.1" required></div><div class="field"><label>Current Grade (0–100)</label><input type="number" name="current_grade" min="0" max="100" step="0.1" value="0" required></div><div class="wide form-actions"><a class="btn secondary" href="{{ url_for('students') }}">Cancel</a><button class="btn">Save Student</button></div></form></div>
{% endblock %}
